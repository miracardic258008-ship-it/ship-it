<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>RadarNav – Türkçe Navigasyon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f8fafc;--surface:rgba(255,255,255,.97);--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent2:rgba(37,99,235,.12);--danger:#dc2626;--warn:#d97706;--border:rgba(0,0,0,.08);--card:#fff;--input:#f1f5f9;--nav:#1d4ed8;--shadow:0 2px 16px rgba(0,0,0,.13)}
body.dark{--bg:#0a0a14;--surface:rgba(15,23,42,.97);--text:#f1f5f9;--muted:#64748b;--accent:#3b82f6;--accent2:rgba(59,130,246,.15);--danger:#ef4444;--warn:#f59e0b;--border:rgba(255,255,255,.09);--card:#0f172a;--input:#1e293b;--nav:#1e40af;--shadow:0 2px 16px rgba(0,0,0,.5)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;height:100dvh;width:100dvw}
#map{position:fixed;inset:0;z-index:0}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important}
#gpsWait{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#searchWrap{position:fixed;top:12px;left:12px;right:68px;z-index:30;pointer-events:auto}
#searchBox{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:10px 14px;gap:8px;box-shadow:var(--shadow)}
#searchInput{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-weight:500;-webkit-user-select:text;user-select:text}
#searchInput::placeholder{color:var(--muted)}
#searchDrop{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;margin-top:6px;overflow:hidden;display:none;max-height:260px;overflow-y:auto;box-shadow:var(--shadow)}
.sItem{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text)}
.sItem:hover{background:var(--accent2)}
#navBar{position:fixed;top:0;left:0;right:0;z-index:30;display:none;flex-direction:column}
#navInner{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--nav);box-shadow:0 4px 16px rgba(0,0,0,.25)}
#navArrow{font-size:30px;min-width:48px;text-align:center}
#navDist{font-size:10px;font-weight:800;color:rgba(255,255,255,.85);text-align:center;margin-top:2px}
#navStep{flex:1;font-size:16px;font-weight:700;color:#fff;line-height:1.3}
#navSub{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px}
#navCancel{width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.22);border:none;cursor:pointer;font-size:17px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#rerouteBar{display:none;align-items:center;justify-content:center;gap:8px;padding:7px;background:var(--warn)}
#rerouteBar span{font-size:13px;font-weight:600;color:#fff}
#speedGauge{position:fixed;left:12px;bottom:96px;z-index:25;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:10px 8px;min-width:72px;text-align:center;box-shadow:var(--shadow)}
#speedVal{font-size:34px;font-weight:900;line-height:1;color:var(--text)}
#speedUnit{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-top:1px;text-transform:uppercase}
#gpsRow{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:4px}
#gpsDot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
#gpsLbl{font-size:7px;font-weight:600;color:var(--muted)}
#radarBanner{position:fixed;bottom:110px;left:12px;right:68px;z-index:35;border-radius:16px;padding:12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#radarBanner .ri{width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
#radarBanner .rt{color:#fff;font-size:15px;font-weight:800}
#radarBanner .rs{color:rgba(255,255,255,.75);font-size:11px;margin-top:2px}
#radarBanner .rd{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0}
#radarBanner .rdv{color:#fff;font-size:16px;font-weight:900}
#radarBanner .rdl{color:rgba(255,255,255,.65);font-size:9px}
#rightPanel{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.ib{width:50px;min-height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);gap:2px;padding:5px 3px}
.ib:hover,.ib.on{background:var(--accent2);border-color:var(--accent)}
.ibl{font-size:8px;font-weight:700;color:var(--muted);line-height:1}
#bottomBar{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:0 8px 8px}
#bottomInner{display:flex;background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:5px 2px;box-shadow:var(--shadow)}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border:none;background:none;color:var(--muted);font-size:9px;font-weight:600}
.bb:hover{color:var(--accent)}
.bi{font-size:19px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.msheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:85dvh;overflow-y:auto;padding-bottom:28px}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.mttl{font-size:18px;font-weight:800}
.mclose{width:34px;height:34px;border-radius:9px;background:var(--input);border:none;cursor:pointer;font-size:15px;color:var(--text)}
#reportPanel{position:fixed;right:64px;top:50%;transform:translateY(-50%);z-index:40;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:12px;display:none;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 7px;background:var(--input);border:1px solid var(--border);border-radius:12px;cursor:pointer;min-width:56px}
.rb:hover{background:var(--accent2)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.slbl{font-size:15px;font-weight:600;color:var(--text)}
.ssub{font-size:12px;color:var(--muted);margin-top:2px}
.tgl{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;transition:.3s}
.tslider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.tgl input:checked+.tslider{background:var(--accent)}
.tgl input:checked+.tslider:before{transform:translateX(20px)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--input);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.sech{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent);padding:18px 16px 6px}
.fi,.pi{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.fn,.pn{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.fc,.ps{font-size:11px;color:var(--muted);margin-top:2px}
.gbtn{padding:7px 14px;border-radius:9px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.dbtn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--danger);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.catgrid{display:flex;flex-wrap:wrap;gap:10px;padding:12px}
.catbtn{width:calc(33.3% - 7px);border-radius:12px;border:1.5px solid var(--border);background:var(--card);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text);text-align:center}
.catbtn:hover,.catbtn.sel{background:var(--accent2);border-color:var(--accent)}
.cemoji{font-size:26px}
@keyframes pulseA{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulseA .9s ease-in-out infinite}
</style>
</head>
<body>

<div id="gpsWait"><div class="spinner"></div><div style="font-size:18px;font-weight:700;color:var(--text)">GPS alınıyor...</div><div style="font-size:13px;color:var(--muted)">Konum iznine izin verin</div><button onclick="skipGPS()" style="margin-top:16px;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">GPS Olmadan Devam Et</button></div>
<div id="map"></div>

<div id="searchWrap">
  <div id="searchBox">
    <span style="color:var(--muted)">🔍</span>
    <input id="searchInput" placeholder="Nereye gidiyorsunuz?" autocomplete="off"/>
    <span id="sClear" style="cursor:pointer;color:var(--muted);display:none">✕</span>
    <div id="sSpin" style="display:none;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0"></div>
  </div>
  <div id="searchDrop"></div>
</div>

<div id="navBar">
  <div id="navInner">
    <div style="display:flex;flex-direction:column;align-items:center;min-width:50px;gap:1px">
      <div id="navArrow">⬆️</div><div id="navDist">--</div>
    </div>
    <div style="flex:1;min-width:0"><div id="navStep">Hazırlanıyor...</div><div id="navSub"></div></div>
    <button onclick="altRoute()" style="width:30px;height:30px;border-radius:8px;background:rgba(16,185,129,.25);border:1.5px solid #10b981;cursor:pointer;font-size:14px;color:#fff;flex-shrink:0">↩</button>
    <button id="navCancel">✕</button>
  </div>
  <div id="rerouteBar"><div class="spinner" style="width:15px;height:15px;border-width:2px"></div><span>Rota yeniden hesaplanıyor...</span></div>
</div>

<div id="speedGauge">
  <div id="speedVal">0</div><div id="speedUnit">KM/S</div>
  <div id="gpsRow"><div id="gpsDot"></div><span id="gpsLbl">GPS</span></div>
</div>

<div id="radarBanner">
  <div class="ri" id="rIcon">📷</div>
  <div style="flex:1;min-width:0"><div class="rt" id="rTitle">Radar</div><div class="rs" id="rSub"></div></div>
  <div class="rd"><div class="rdv" id="rDist">--</div><div class="rdl">ileride</div></div>
</div>

<div id="rightPanel">
  <button class="ib" onclick="goMyLocation()" title="Konumuma Git"><span style="font-size:16px">🎯</span><span class="ibl">Konum</span></button>
  <button class="ib" id="btnCam" onclick="camNext()" title="Kamera Modu"><span style="font-size:17px">🚗</span><span class="ibl">Önden</span></button>
  <button class="ib" id="btnLayer" onclick="layerNext()" title="Harita Tipi"><span style="font-size:17px">☀️</span><span class="ibl">Açık</span></button>
  <button class="ib on" id="btnToll" onclick="toggleTolls()" title="Paralı Geçişler"><span style="font-size:17px">🛣️</span><span class="ibl">Gişeler</span></button>
  <button class="ib" id="btnSim" onclick="toggleSim()" title="Simülasyon"><span style="font-size:17px">🎮</span><span class="ibl">Sim</span></button>
  <button class="ib" id="btnVoice" onclick="voiceNext()" title="Ses"><span style="font-size:17px">🔊</span><span class="ibl">Ses</span></button>
  <button class="ib" id="btnCursor" onclick="openModal('cursorModal')" title="İmleç Seç"><span style="font-size:17px">🎯</span><span class="ibl">İmleç</span></button>
  <button class="ib" onclick="document.getElementById('reportPanel').style.display=document.getElementById('reportPanel').style.display==='flex'?'none':'flex'" title="Bildir"><span style="font-size:17px">📢</span><span class="ibl">Bildir</span></button>
  <button class="ib" onclick="buildSettings();openModal('settingsModal')" title="Ayarlar"><span style="font-size:17px">⚙️</span><span class="ibl">Ayarlar</span></button>
</div>

<div id="reportPanel">
  <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:4px">📢 Bildir</div>
  <div style="display:flex;gap:7px;flex-wrap:wrap">
    <div class="rb" onclick="userReport('police')"><span style="font-size:20px">👮</span><span style="font-size:9px;color:var(--muted);font-weight:700">Polis</span></div>
    <div class="rb" onclick="userReport('mobile_radar')"><span style="font-size:20px">🚔</span><span style="font-size:9px;color:var(--muted);font-weight:700">Seyyar</span></div>
    <div class="rb" onclick="userReport('accident')"><span style="font-size:20px">💥</span><span style="font-size:9px;color:var(--muted);font-weight:700">Kaza</span></div>
    <div class="rb" onclick="userReport('hazard')"><span style="font-size:20px">⚠️</span><span style="font-size:9px;color:var(--muted);font-weight:700">Tehlike</span></div>
    <div class="rb" onclick="userReport('traffic_jam')"><span style="font-size:20px">🚦</span><span style="font-size:9px;color:var(--muted);font-weight:700">Trafik</span></div>
  </div>
</div>

<div id="bottomBar"><div id="bottomInner">
  <button class="bb" onclick="goHome()"><span class="bi">🏠</span>Eve Git</button>
  <button class="bb" onclick="goCar()"><span class="bi">🅿️</span>Arabama</button>
  <button class="bb" onclick="parkCar()"><span class="bi">🚗</span>Park Et</button>
  <button class="bb" onclick="goMyLocation()"><span class="bi">🎯</span>Konumuma</button>
  <button class="bb" onclick="openModal('favModal')"><span class="bi">⭐</span>Favoriler</button>
  <button class="bb" onclick="openModal('nearbyModal')"><span class="bi">📍</span>Yakınımda</button>
</div></div>

<div class="modal" id="favModal"><div class="msheet">
  <div class="mhdr"><span class="mttl">⭐ Favoriler</span><button class="mclose" onclick="closeModal('favModal')">✕</button></div>
  <div onclick="addFav()" style="margin:12px;border-radius:12px;border:1.5px dashed var(--accent);padding:13px;cursor:pointer;text-align:center;color:var(--accent);font-weight:700;font-size:14px">＋ Mevcut Konumu Ekle</div>
  <div id="favList"></div>
</div></div>

<div class="modal" id="nearbyModal"><div class="msheet">
  <div class="mhdr"><span class="mttl">📍 Yakınımda</span><button class="mclose" onclick="closeModal('nearbyModal')">✕</button></div>
  <div class="catgrid" id="catGrid"></div>
  <div id="nearbyRes"></div>
</div></div>

<div class="modal" id="settingsModal"><div class="msheet">
  <div class="mhdr"><span class="mttl">⚙️ Ayarlar</span><button class="mclose" onclick="closeModal('settingsModal')">✕</button></div>
  <div id="settContent"></div>
</div></div>

<!-- İmleç Seçim Modalı -->
<div class="modal" id="cursorModal"><div class="msheet">
  <div class="mhdr"><span class="mttl">🎯 İmleç Seç</span><button class="mclose" onclick="closeModal('cursorModal')">✕</button></div>
  <div id="cursorGrid" style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px"></div>
</div></div>

<script>
// ── AYARLAR ──────────────────────────────────────────────────
const DEF={layer:'light',camera:'drive',unit:'kmh',voice:true};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem('RBS')||'{}'));
function saveS(){localStorage.setItem('RBS',JSON.stringify(S));}
let homePos=JSON.parse(localStorage.getItem('RBhome')||'null');
let carPos=JSON.parse(localStorage.getItem('RBcar')||'null');
let favs=JSON.parse(localStorage.getItem('RBfavs')||'[]');
function saveFavs(){localStorage.setItem('RBfavs',JSON.stringify(favs));}

// ── TİLELER ──────────────────────────────────────────────────
const TILES={
  light:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  osm:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  satellite:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  topo:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
};
// Almanya ve tüm dünya için OSM her zaman çalışır
const LLIST=['light','dark','osm','satellite','topo'];
const LICO={light:'☀️',dark:'🌑',osm:'🗺️',satellite:'🛰️',topo:'🏔️'};
const LLBL={light:'Açık',dark:'Koyu',osm:'OSM',satellite:'Uydu',topo:'Topo'};
const CCYCLE=['drive','top','back','side','free'];
const CICO={drive:'🚗',top:'🛸',back:'🔙',side:'↔️',free:'🔓'};
const CLBL={drive:'Önden',top:'Üstten',back:'Arkadan',side:'Yandan',free:'Serbest'};
const CAM={
  drive:{oY:0.0006,oX:0,zoom:17},   // önden: araç altta, yol yukarıda
  top:{oY:0,oX:0,zoom:16},           // üstten: tam merkez
  back:{oY:0.0006,oX:0,zoom:17},     // arkadan: araç üstte
  side:{oY:0,oX:0.0006,zoom:16},     // yandan: sağa kaydır
  free:{oY:0,oX:0,zoom:15}
};

// ── HARİTA ───────────────────────────────────────────────────
const map=L.map('map',{zoomControl:false,attributionControl:false,tap:false,preferCanvas:true});
let tileL=L.tileLayer(TILES[S.layer],{maxZoom:20}).addTo(map);
map.setView([39.9,32.8],16);
if(S.layer==='dark') document.body.classList.add('dark');

function mkArrowByStyle(h,cam){
  const id=(typeof S!=='undefined'&&S.cursorId)||'arrow_blue';
  const CURSORS_REF=typeof CURSORS!=='undefined'?CURSORS:[{id:'arrow_blue',col:'#2563eb',shape:'arrow'}];
  const c=CURSORS_REF.find(x=>x.id===id)||CURSORS_REF[0];
  const sz=cam==='drive'?58:cam==='back'?50:cam==='side'?46:42;
  const rot=cam==='back'?h+180:cam==='side'?h+90:h;
  const svg=typeof cursorSVG==='function'?cursorSVG(c.shape,c.col,52):
    `<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="${c.col}" opacity=".2"/><polygon points="26,5 42,44 26,33 10,44" fill="${c.col}" stroke="#fff" stroke-width="2.5"/><circle cx="26" cy="26" r="5" fill="#fff"/></svg>`;
  return L.divIcon({
    html:`<div style="transform:rotate(${rot}deg);width:${sz}px;height:${sz}px;transition:transform .25s ease;filter:drop-shadow(0 3px 8px ${c.col}88)">${svg}</div>`,
    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],className:''
  });
}

function mkArrow(h,cam){
  // İmleç seçimi varsa onu kullan
  if(typeof S!=='undefined'&&S.cursorId) return mkArrowByStyle(h,cam);
  const sz=cam==='drive'?58:cam==='back'?50:cam==='side'?46:42;
  const rot=cam==='back'?h+180:cam==='side'?h+90:h;

  // Hıza göre renk seç — Google Maps tarzı dinamik
  const spd=curSpd||0;
  const col = spd>90?'#22c55e':   // hızlı = yeşil
              spd>60?'#3b82f6':   // normal = mavi
              spd>30?'#f59e0b':   // yavaş = sarı
              spd>5 ?'#ef4444':   // çok yavaş = kırmızı
                     '#8b5cf6';   // dur/başlangıç = mor

  // Vurgu rengi (glow)
  const glow=col.replace('#','');

  // Kamera moduna göre farklı şekil
  let svg='';
  if(cam==='drive'){
    // Sürüş: Google Maps tarzı ok
    svg=`<defs>
      <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="26" cy="26" r="24" fill="${col}" opacity=".18" filter="url(#glow)"/>
    <circle cx="26" cy="26" r="20" fill="${col}" opacity=".12"/>
    <polygon points="26,3 44,46 26,35 8,46" fill="${col}" stroke="#fff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="26" cy="26" r="7" fill="#fff" opacity=".95"/>
    <circle cx="26" cy="26" r="4" fill="${col}"/>`;
  } else if(cam==='top'){
    // Üstten: daire + ok

<script>

}
    const c=CAM[S.camera]||CAM.drive;

};
function amKey(txt){for(const[k,v]of Object.entries(AM)){if(v===txt)return k;}return null;}

let _aQ=[],_aP=false,_aCur=null,_trV=null,_vReady=false;
let _lastSpoken='',_lastSpokenAt=0;

function initV(){
  if(!window.speechSynthesis)return;
  const all=window.speechSynthesis.getVoices();
  if(!all.length)return;
  _trV=all.find(v=>/leyla/i.test(v.name))||all.find(v=>/seda|emel/i.test(v.name))||all.find(v=>v.lang==='tr-TR')||all.find(v=>v.lang.startsWith('tr'));
  _vReady=true;
  if(_aQ.length)_procAQ();
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=initV;initV();[300,800,2000].forEach(t=>setTimeout(initV,t));}

function speak(txt,pri){
  if(!S.voice||!txt)return;
  // Aynı ses 3 sn içinde tekrar söylenmesin
  const now=Date.now();
  if(txt===_lastSpoken&&now-_lastSpokenAt<3000)return;
  if(pri){
    _aQ=[];
    if(_aCur){try{_aCur.pause();_aCur.currentTime=0;}catch{}; _aCur=null;}
    try{window.speechSynthesis?.cancel();}catch{}
    _aP=false;
  }
  // Kuyrukta zaten varsa ekleme
  if(_aQ.includes(txt))return;
  // Kuyruk max 2 ses — taşmasın
  if(_aQ.length>=2)_aQ=[];
  _aQ.push(txt);
  _procAQ();
}

let _procRunning=false;
async function _procAQ(){
  if(_procRunning||_aP||!_aQ.length)return;
  _procRunning=true;
  _aP=true;
  const txt=_aQ.shift();
  _lastSpoken=txt;
  _lastSpokenAt=Date.now();
  try{
    const k=amKey(txt);
    if(k){
      await new Promise(res=>{
        const a=new Audio(`audio/${k}.mp3`);_aCur=a;
        a.onended=()=>{_aCur=null;res();};
        a.onerror=()=>{_aCur=null;_wsTTS(txt).then(res);};
        a.play().catch(()=>{_aCur=null;_wsTTS(txt).then(res);});
        setTimeout(()=>{if(_aCur){try{_aCur.pause();}catch{}_aCur=null;res();}},8000);
      });
    } else {
      await _wsTTS(txt);
    }
  }catch{}
  _aP=false;_procRunning=false;
  if(_aQ.length)setTimeout(_procAQ,80);
}

function _wsTTS(txt){
  return new Promise(res=>{
    if(!window.speechSynthesis){res();return;}
    try{window.speechSynthesis.cancel();}catch{}
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='tr-TR';u.rate=1.0;u.pitch=1.05;u.volume=1;
    if(_trV)u.voice=_trV;
    u.onend=()=>res();
    u.onerror=()=>res();
    window.speechSynthesis.speak(u);
    setTimeout(res,Math.min(txt.length*90+2000,8000));
  });
}

<script>
// ── ROTA & NAVİGASYON ───────────────────────────────────────
function sText(t,m,ex){
  const ORD=['','birinci','ikinci','üçüncü','dördüncü','beşinci','altıncı','yedinci','sekizinci'];
  const M={left:'sola',right:'sağa','sharp left':'keskin sola','sharp right':'keskin sağa','slight left':'hafif sola','slight right':'hafif sağa',straight:'düz',uturn:'geri'};
  const m2=M[m]||'';
  switch(t){
    case 'depart':return'Yola çıkılıyor.';
    case 'arrive':return m==='left'?'Varış noktanız solunuzda.':m==='right'?'Varış noktanız sağınızda.':'Hedefe ulaştınız.';
    case 'turn':return m2?`${m2} dönün.`:'Dönün.';
    case 'continue':case 'new name':return m2&&m2!=='düz'?`${m2} devam edin.`:'Düz devam edin.';
    case 'roundabout':case 'rotary':{const e=ex||0;if(e>=1&&e<=8)return`Dönel kavşakta ${ORD[e]}. çıkıştan çıkın.`;return m2?`Dönel kavşaktan ${m2} çıkın.`:'Dönel kavşaktan çıkın.';}
    case 'exit roundabout':case 'exit rotary':return'Kavşaktan çıkın.';
    case 'on ramp':return m==='left'?'Soldan rampaya girin.':'Sağdan rampaya girin.';
    case 'off ramp':return m==='left'?'Soldan rampadan çıkın.':'Sağdan rampadan çıkın.';
    case 'fork':return m==='left'?'Çatalda sola gidin.':'Çatalda sağa gidin.';
    case 'uturn':return'Mümkün olan ilk yerde geri dönün.';
    default:return m2?`${m2} dönün.`:'Düz devam edin.';
  }
}
function sArrow(t,m){
  if(t==='arrive')return'📍';if(t==='depart')return'▶️';
  if(t==='roundabout'||t==='rotary')return'🔄';if(t==='uturn')return'↩️';
  if(m==='left'||m==='sharp left')return'⬅️';if(m==='right'||m==='sharp right')return'➡️';
  if(m==='slight left')return'↖️';if(m==='slight right')return'↗️';
  return'⬆️';
}
function dLbl(m){
  if(m>=900)return`${Math.round(m/100)*100} metre sonra`;
  if(m>=450)return'500 metre sonra';if(m>=250)return'300 metre sonra';
  if(m>=150)return'200 metre sonra';if(m>=80)return'100 metre sonra';
  if(m>=30)return'50 metre sonra';return'hemen şimdi';
}
function navVoice(dist,txt,typ,mod,ex){
  if(typ==='arrive'){spkSys('nav_arrived');return;}
  if(typ==='depart'){speak(AM.nav_start);return;}
  const dk=dist<=55?'50m':dist<=110?'100m':dist<=210?'200m':dist<=350?'300m':dist<=600?'500m':'1km';
  if(typ==='roundabout'||typ==='rotary'){const e=ex||0;const k=e>=1&&e<=4?`roundabout_${e}`:dist<=110?'roundabout_100m':dist<=210?'roundabout_200m':'roundabout_exit';if(AM[k]){speak(AM[k]);return;}}
  if(typ==='on ramp'){speak(AM[mod==='left'?'ramp_left':'ramp_right']);return;}
  if(typ==='off ramp'){speak(AM[mod==='left'?'ramp_exit_left':'ramp_exit_right']);return;}
  if(typ==='uturn'){speak(AM[dist<=55?'uturn_now':'uturn_100m']);return;}
  const isSR=mod==='slight right',isSL=mod==='slight left',isShR=mod==='sharp right',isShL=mod==='sharp left';
  const isR=mod==='right'||isShR||isSR,isL=mod==='left'||isShL||isSL;
  let pfx=isSR?'slight_right':isSL?'slight_left':isShR?'sharp_right':isShL?'sharp_left':isR?'turn_right':isL?'turn_left':'straight';
  if(dist<35){const k=`${pfx}_now`;if(AM[k]){speak(AM[k]);return;}}
  const k=`${pfx}_${dk}`;
  if(AM[k]){speak(AM[k]);return;}
  for(const d of['50m','100m','200m','300m','500m','1km']){const k2=`${pfx}_${d}`;if(AM[k2]){speak(AM[k2]);return;}}
  speak(dist<35?txt:`${dLbl(dist)} ${txt}`);
}

  document.getElementById('navStep').textContent='Rota hesaplanıyor...';
  document.getElementById('navArrow').textContent='⏳';
  closeModal('favModal');closeModal('nearbyModal');closeModal('settingsModal');
  speak('Rota hesaplanıyor. Lütfen bekleyin.');
  const r=await calcRoute(curLat,curLng,lat,lng);
  if(!r){spkSys('nav_no_route');stopNav();return;}
  routeData=r;drawRoute(r,lat,lng);
  // Rota üzerindeki radarları önceden tara
  scanRouteRadars(r.steps);
  spkSys('nav_ready');
  setTimeout(()=>speak(`Toplam ${fmtD(r.dist)}, yaklaşık ${fmtT(r.dur)}.`),900);
  setTimeout(()=>{if(r.steps[0])speak(`İlk talimat: ${r.steps[0].text}`);},2300);
  navUpd();
}
async function calcRoute(fla,fln,tla,tln){
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${fln},${fla};${tln},${tla}?steps=true&geometries=geojson&overview=full`);
    const d=await r.json();
    if(d.code!=='Ok'||!d.routes?.length)return null;
    const leg=d.routes[0].legs[0];
    return{
      steps:leg.steps.map(s=>{const t=s.maneuver?.type||'',m=s.maneuver?.modifier||'',e=s.maneuver?.exit||0;return{text:sText(t,m,e),arrow:sArrow(t,m),type:t,mod:m,exit:e,dist:s.distance,lat:s.maneuver.location[1],lng:s.maneuver.location[0]};},),
      poly:d.routes[0].geometry.coordinates.map(c=>({lat:c[1],lng:c[0]})),
      dist:d.routes[0].distance,dur:d.routes[0].duration
    };
  }catch{return null;}
}
function drawRoute(r,tla,tln){
  _clrRoute();
  const pts=r.poly.map(c=>[c.lat,c.lng]);
  routeO=L.polyline(pts,{color:'rgba(30,58,138,.25)',weight:12,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  routeL=L.polyline(pts,{color:'#2563eb',weight:7,opacity:.96,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  destMk=L.marker([tla,tln],{icon:L.divIcon({html:'<div style="font-size:34px;margin-top:-34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))">📍</div>',iconSize:[34,34],iconAnchor:[17,34],className:''})}).addTo(map);
  try{map.fitBounds(L.polyline(pts).getBounds(),{padding:[80,80],maxZoom:16,animate:true,duration:.8});}catch{}
}
function _clrRoute(){if(routeO){map.removeLayer(routeO);routeO=null;}if(routeL){map.removeLayer(routeL);routeL=null;}if(destMk){map.removeLayer(destMk);destMk=null;}}
function navUpd(){
  if(!routeData||curLat==null)return;
  const steps=routeData.steps;if(stepIdx>=steps.length){stopNav();return;}
  const st=steps[stepIdx],last=steps[steps.length-1];
  const dN=hav(curLat,curLng,st.lat,st.lng),dD=hav(curLat,curLng,last.lat,last.lng);
  document.getElementById('navArrow').textContent=st.arrow;
  document.getElementById('navDist').textContent=fmtD(dN);
  document.getElementById('navStep').textContent=st.text.charAt(0).toUpperCase()+st.text.slice(1);
  const eta=Math.round(dD/Math.max(curSpd/3.6,6));
  const arr=new Date(Date.now()+eta*1000);
  document.getElementById('navSub').textContent=`Kalan: ${fmtD(dD)} · ${fmtT(eta)} · Varış: ${arr.getHours().toString().padStart(2,'0')}:${arr.getMinutes().toString().padStart(2,'0')}`;
  if(dD<35){spkSys('nav_arrived');stopNav();return;}
  if(dN<22&&stepIdx<steps.length-1){stepIdx++;return;}
  for(const lvl of[1000,500,300,200,100,40]){
    const k=`${stepIdx}_${lvl}`;
    if(dN<=lvl&&!warnedR['s'+k]){warnedR['s'+k]=true;navVoice(dN,st.text,st.type,st.mod,st.exit);break;}
  }
  const now=Date.now();if(dN>130&&now-rerouteAt>22000){rerouteAt=now;doReroute();}
  // km taşı
  const km=Math.floor(dD/1000);if(km>=1&&km<=5&&!warnedR['km'+km]){warnedR['km'+km]=true;const k=`km_${km}_left`;if(AM[k])speak(AM[k]);}
}
async function doReroute(){
  document.getElementById('rerouteBar').style.display='flex';
  spkSys('nav_reroute');
  const last=routeData.steps[routeData.steps.length-1];
  const nr=await calcRoute(curLat,curLng,last.lat,last.lng);
  if(nr){routeData=nr;stepIdx=0;drawRoute(nr,last.lat,last.lng);}
  document.getElementById('rerouteBar').style.display='none';
}
function stopNav(){
  navActive=false;followMode=false;routeData=null;stepIdx=0;warnedR={};
  _clrRoute();
  document.getElementById('navBar').style.display='none';
  document.getElementById('rerouteBar').style.display='none';
  document.getElementById('searchWrap').style.display='block';
  document.getElementById('bottomBar').style.display='block';
  updGauge();
}
document.getElementById('navCancel').onclick=()=>{if(confirm('Navigasyonu iptal et?')){spkSys('nav_stop');stopNav();}};

async function altRoute(){
  if(!navActive||!routeData||!curLat)return;
  const last=routeData.steps[routeData.steps.length-1];
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${curLng},${curLat};${last.lng},${last.lat}?steps=true&geometries=geojson&overview=full&alternatives=true`);
    const d=await r.json();
    if(!d.routes||d.routes.length<2){alert('Alternatif rota bulunamadı.');return;}
    const alt=d.routes[1];
    const pts=alt.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(window._altL)map.removeLayer(window._altL);
    window._altL=L.polyline(pts,{color:'#10b981',weight:5,opacity:.7,dashArray:'10,8',lineCap:'round',interactive:true}).addTo(map);
    window._altL.bindPopup(`<b>Alternatif Rota</b><br>${fmtD(alt.distance)} · ${fmtT(alt.duration)}<br><button onclick="useAlt(${last.lat},${last.lng})" style="margin-top:6px;padding:5px 12px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">Bu Rotayı Kullan</button>`).openPopup();
    spkSys('alt_route');
    speak(`Alternatif rota: ${fmtD(alt.distance)}, yaklaşık ${fmtT(alt.duration)}.`);
  }catch{}
}
async function useAlt(la,ln){
  if(window._altL){map.removeLayer(window._altL);window._altL=null;}
  const nr=await calcRoute(curLat,curLng,la,ln);
  if(nr){routeData=nr;stepIdx=0;drawRoute(nr,la,ln);spkSys('alt_route_used');}
}
</script>

let radarMks={};

function initRadars(){radarPts.forEach(r=>addRM(r));}
function addRM(r){

  const spd=r.spd?`<div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:${c};color:#fff;font-size:8px;font-weight:900;padding:1px 4px;border-radius:4px;white-space:nowrap">${r.spd}</div>`:'';

}
async function fetchRadars(){

      if(!radarPts.find(r=>r.id===pt.id)){radarPts.push(pt);addRM(pt);}
    });

}
function chkRadars(){
  if(!curLat)return;
  let near=null,nearD=Infinity;
  [...radarPts,...userReports].forEach(r=>{
    const d=hav(curLat,curLng,r.lat,r.lng);
    // 5km dışına çıkınca tamamen sıfırla
    if(d>5000){delete warnedR[r.id];return;}
    // 250m'yi geçip uzaklaşıyorsa (radar arkada kaldı) → sıfırla
    if(d>300&&warnedR[r.id]instanceof Set&&warnedR[r.id].has(250)){
      delete warnedR[r.id];
      return;
    }
    if(d<=2000){
      if(!warnedR[r.id])warnedR[r.id]=new Set();
      for(const lvl of[2000,1000,500,250]){
        if(d<=lvl&&!warnedR[r.id].has(lvl)){
          warnedR[r.id].add(lvl);
          const dk=d<=300?'250m':d<=600?'500m':'1km';
          const km={fixed_radar:`radar_fixed_${dk}`,average_radar:`radar_fixed_${dk}`,mobile_radar:`radar_mobile_${dk}`,police:`radar_police_${dk}`,redlight_camera:'radar_accident',accident:'radar_accident',traffic_jam:'radar_traffic',hazard:'radar_hazard'};
          const k=km[r.type];if(k&&AM[k])speak(AM[k],true);
          else speak(`Dikkat! ${dLbl(d)} ${RL[r.type]||'uyarı'}.`,true);
          break;
        }
      }
    }
    if(d<nearD){nearD=d;near=r;}
  });
  const b=document.getElementById('radarBanner');
  // Banner: sadece 250m'ye kadar göster, 250m geçince gizle
  if(near&&nearD<=2000){
    b.style.display='flex';b.style.background=RC[near.type]||'#f59e0b';
    document.getElementById('rIcon').textContent=RE[near.type]||'⚠️';
    document.getElementById('rTitle').textContent=RL[near.type]||'Radar';
    document.getElementById('rSub').textContent=near.name||(near.type==='police'?'📢 Bildirilen kontrol noktası':'');
    document.getElementById('rDist').textContent=fmtD(nearD);
    nearD<250?b.classList.add('pulse'):b.classList.remove('pulse');
  }else{
    b.style.display='none';
    b.classList.remove('pulse');
  }
}
function userReport(type){

  const pt={id:'u_'+Date.now(),type,lat:curLat,lng:curLng,spd:0,name:'Kullanıcı bildirimi'};
  userReports.push(pt);addRM(pt);
  document.getElementById('reportPanel').style.display='none';
  spkSys('report_saved');
}

      if(d<=lvl&&!warnedTolls[t.id].has(lvl)){

// ── TRAFİK KATMANI ────────────────────────────────────────────
let trafficOv=null,trafficOn=false,trafficTimer=null;
function toggleTraffic(){
  trafficOn=!trafficOn;
  const btn=document.getElementById('btnTraffic');
  btn.classList.toggle('on',trafficOn);
  if(trafficOn){
    btn.querySelector('.ibl').textContent='Yükleniyor';
    spkSys('traffic_on');
    fetchTraffic();
    trafficTimer=setInterval(fetchTraffic,120000);
  } else {
    if(trafficTimer){clearInterval(trafficTimer);trafficTimer=null;}
    if(trafficOv){map.removeLayer(trafficOv);trafficOv=null;}
    btn.querySelector('.ibl').textContent='Trafik';
    spkSys('traffic_off');
  }
}
async function fetchTraffic(){
  if(!curLat){
    document.getElementById('btnTraffic').querySelector('.ibl').textContent='GPS Yok';
    return;
  }
  const btn=document.getElementById('btnTraffic');
  try{
    // Kısa timeout — takılmaması için
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),7000);
    const q=`[out:json][timeout:8];way["highway"~"primary|secondary|trunk"](around:2500,${curLat},${curLng});out geom 15;`;
    const r=await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      body:'data='+encodeURIComponent(q),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(trafficOv){map.removeLayer(trafficOv);trafficOv=null;}
    const els=(d.elements||[]).filter(e=>e.geometry&&e.geometry.length>1);
    if(!els.length){btn.querySelector('.ibl').textContent='Boş';return;}
    // Renkleri yol tipine göre belirle
    const layers=els.map(e=>{
      const pts=e.geometry.map(p=>[p.lat,p.lon]);
      const hw=e.tags?.highway||'';
      const col=hw==='trunk'?'#ef4444':hw==='primary'?'#f97316':'#f59e0b';
      const w=hw==='trunk'?7:hw==='primary'?5:4;
      const pl=L.polyline(pts,{color:col,weight:w,opacity:.65,lineCap:'round',lineJoin:'round',interactive:true});
      const nm=e.tags?.name||e.tags?.ref||'Yol';
      const tip=hw==='trunk'?'Otoyol/Anayol':hw==='primary'?'Ana Yol':'Yol';
      pl.bindTooltip(`🚗 ${tip}: ${nm}`,{sticky:true,opacity:.9});
      return pl;
    });
    trafficOv=L.layerGroup(layers).addTo(map);
    btn.querySelector('.ibl').textContent='Canlı';
  }catch(e){
    if(e.name==='AbortError'){btn.querySelector('.ibl').textContent='Zaman Aşımı';}
    else{btn.querySelector('.ibl').textContent='Hata';}
    console.warn('Trafik:',e.message);
    // Hata olsa da trafficOn kalsın, bir sonraki interval'de tekrar dene
  }
}
</script>

function buildCatGrid(){
  document.getElementById('catGrid').innerHTML=CATS.map(c=>`<div class="catbtn" id="cat_${c.k}" onclick="loadCat('${c.k}')"><span class="cemoji">${c.e}</span>${c.l}</div>`).join('');
  document.getElementById('nearbyRes').innerHTML='';
}
async function loadCat(k){
  if(!curLat){spkSys('no_gps');return;}
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('sel'));
  const btn=document.getElementById('cat_'+k);if(btn)btn.classList.add('sel');
  const cat=CATS.find(c=>c.k===k);if(!cat)return;
  const res=document.getElementById('nearbyRes');
  res.innerHTML='<div style="padding:18px;text-align:center;color:var(--muted)"><div class="spinner" style="margin:0 auto 10px"></div>Aranıyor...</div>';
  const qs=cat.q.split(';').map(q=>`  ${q.trim()}(around:3000,${curLat},${curLng});`).join('\n');
  const oq=`[out:json][timeout:25];\n(\n${qs}\n);\nout body 15;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(oq),signal:AbortSignal.timeout(20000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const els=(d.elements||[]).filter(e=>e.lat!=null&&e.lon!=null);
    placeMks.forEach(m=>{try{map.removeLayer(m);}catch{}});placeMks=[];
    const pts=els.map(e=>({name:e.tags?.name||e.tags?.brand||cat.l,lat:e.lat,lng:e.lon,dist:hav(curLat,curLng,e.lat,e.lon)})).sort((a,b)=>a.dist-b.dist).slice(0,15);
    pts.forEach(p=>{
      const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({html:`<div style="font-size:20px;background:#fff;border:2.5px solid var(--accent);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)">${cat.e}</div>`,iconSize:[34,34],iconAnchor:[17,17],className:''})}).addTo(map);
      mk.bindTooltip(p.name,{direction:'top',opacity:.95});placeMks.push(mk);
    });
    if(pts.length){try{map.fitBounds(L.featureGroup(placeMks).getBounds(),{padding:[60,60],maxZoom:15,animate:true});}catch{}}
    if(!pts.length){res.innerHTML='<div style="padding:18px;text-align:center;color:var(--muted)">Bu kategoride 3 km içinde sonuç bulunamadı.</div>';return;}
    res.innerHTML=pts.map(p=>{const esc=p.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');return`<div class="pi"><span style="font-size:22px">${cat.e}</span><div style="flex:1;min-width:0"><div class="pn" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div class="ps">${cat.l} · ${fmtD(p.dist)}</div></div><button class="gbtn" onclick="closeModal('nearbyModal');setTimeout(()=>startNav('${esc}',${p.lat},${p.lng}),100)">Git →</button></div>`;}).join('');
  }catch(e){res.innerHTML='<div style="padding:18px;text-align:center;color:var(--danger)">Veri yüklenemedi.</div>';}
}
</script>

let stimer=null;
const inp=document.getElementById('searchInput');
inp.addEventListener('click',e=>e.stopPropagation());
inp.addEventListener('focus',e=>e.stopPropagation());
inp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
inp.addEventListener('input',()=>{
  const v=inp.value.trim();
  document.getElementById('sClear').style.display=v?'inline':'none';
  clearTimeout(stimer);

});
document.getElementById('sClear').onclick=()=>{inp.value='';document.getElementById('searchDrop').style.display='none';document.getElementById('sClear').style.display='none';inp.focus();};
async function doSearch(q){
  document.getElementById('sSpin').style.display='block';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&accept-language=tr`,{headers:{'Accept-Language':'tr'},signal:AbortSignal.timeout(8000)});
    const data=await r.json();
    const drop=document.getElementById('searchDrop');drop.innerHTML='';
    if(!data.length){drop.style.display='none';return;}
    data.forEach(d=>{
      const el=document.createElement('div');el.className='sItem';
      el.innerHTML=`<span style="flex-shrink:0;color:var(--accent)">📍</span><span>${d.display_name}</span>`;

      drop.appendChild(el);
    });
    drop.style.display='block';
  }catch{}
  document.getElementById('sSpin').style.display='none';
}
document.addEventListener('click',e=>{if(!document.getElementById('searchWrap').contains(e.target))document.getElementById('searchDrop').style.display='none';});

];

function cursorSVG(shape,col,sz){
  sz=sz||52;
  if(shape==='arrow'){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" fill="${col}" opacity=".2"/>
      <polygon points="26,5 42,44 26,33 10,44" fill="${col}" stroke="#fff" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="5" fill="#fff" opacity=".9"/>
    </svg>`;
  } else if(shape==='car'){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" fill="${col}" opacity=".15"/>
      <rect x="14" y="18" width="24" height="16" rx="4" fill="${col}" stroke="#fff" stroke-width="2"/>
      <rect x="17" y="14" width="18" height="8" rx="3" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <circle cx="18" cy="35" r="3" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
      <circle cx="34" cy="35" r="3" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
      <polygon points="26,4 30,14 22,14" fill="${col}" stroke="#fff" stroke-width="1.5"/>
    </svg>`;
  } else if(shape==='dot'){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" fill="${col}" opacity=".2"/>
      <circle cx="26" cy="26" r="14" fill="${col}" stroke="#fff" stroke-width="3"/>
      <circle cx="26" cy="26" r="6" fill="#fff"/>
    </svg>`;
  } else if(shape==='google'){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" fill="${col}" opacity=".25"/>
      <circle cx="26" cy="26" r="16" fill="${col}"/>
      <polygon points="26,6 44,44 26,36 8,44" fill="${col}" stroke="#fff" stroke-width="3"/>
      <circle cx="26" cy="26" r="7" fill="#fff"/>
      <circle cx="26" cy="26" r="4" fill="${col}"/>
    </svg>`;
  } else if(shape==='waze'){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" fill="${col}" opacity=".2"/>
      <ellipse cx="26" cy="28" rx="16" ry="14" fill="${col}" stroke="#fff" stroke-width="2"/>
      <circle cx="20" cy="24" r="3" fill="#1e293b"/>
      <circle cx="32" cy="24" r="3" fill="#1e293b"/>
      <path d="M19 31 Q26 36 33 31" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <polygon points="26,6 30,16 22,16" fill="${col}" stroke="#fff" stroke-width="1.5"/>
    </svg>`;
  }
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52"><circle cx="26" cy="26" r="20" fill="${col}"/></svg>`;
}

<script>
// ── 3D KATMAN POI: MARKET, EV, BAKKAL, İŞ YERLERİ ───────────
let poiMks=[],poiActive=false,poiTimer=null;
const POI_TYPES=[
  {q:'node["shop"="supermarket"]',e:'🛒',l:'Market',c:'#16a34a'},
  {q:'node["shop"="convenience"]',e:'🏪',l:'Bakkal',c:'#15803d'},
  {q:'node["shop"="butcher"]',e:'🥩',l:'Kasap',c:'#dc2626'},
  {q:'node["shop"="bakery"]',e:'🥖',l:'Fırın',c:'#d97706'},
  {q:'node["amenity"="restaurant"]',e:'🍽️',l:'Restoran',c:'#ea580c'},
  {q:'node["amenity"="cafe"]',e:'☕',l:'Kafe',c:'#92400e'},
  {q:'node["amenity"="pharmacy"]',e:'💊',l:'Eczane',c:'#0891b2'},
  {q:'node["amenity"="bank"]',e:'🏦',l:'Banka',c:'#1d4ed8'},
  {q:'node["amenity"="post_office"]',e:'📮',l:'PTT',c:'#7c3aed'},
  {q:'node["building"="residential"]',e:'🏠',l:'Konut',c:'#64748b'}
];

async function fetchPOI(){
  if(!curLat)return;
  const zoom=map.getZoom();
  if(zoom<14){poiMks.forEach(m=>{try{map.removeLayer(m);}catch{}});poiMks=[];return;}
  try{
    const qs=POI_TYPES.map(t=>`  ${t.q}(around:800,${curLat},${curLng});`).join('\n');
    const q=`[out:json][timeout:10];\n(\n${qs}\n);\nout body 40;`;
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctrl.signal});
    if(!r.ok)return;
    const d=await r.json();
    poiMks.forEach(m=>{try{map.removeLayer(m);}catch{}});poiMks=[];
    (d.elements||[]).filter(e=>e.lat&&e.lon).forEach(e=>{
      const type=POI_TYPES.find(t=>{
        const k=t.q.match(/"([^"]+)"="([^"]+)"/);
        return k&&e.tags?.[k[1]]===k[2];
      })||POI_TYPES[0];
      const name=e.tags?.name||e.tags?.brand||type.l;
      const mk=L.marker([e.lat,e.lon],{icon:L.divIcon({
        html:`<div style="background:#fff;border:2px solid ${type.c};border-radius:8px;padding:2px 5px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:${type.c};box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap"><span>${type.e}</span><span style="max-width:60px;overflow:hidden;text-overflow:ellipsis">${name}</span></div>`,
        iconSize:[null,null],iconAnchor:[0,0],className:''
      }),zIndexOffset:100}).addTo(map);
      mk.bindTooltip(`${type.e} ${name} — ${type.l}`,{direction:'top',opacity:.95});
      poiMks.push(mk);
    });
  }catch{}
}

// Zoom değişince POI yenile
map.on('moveend',()=>{if(poiActive)fetchPOI();});

// ── YOL KEYİ TABELA VE HIZ SINIRI İKONLARI ────────────────────
let signMks=[],signsActive=false;
async function fetchRoadSigns(){
  if(!curLat)return;
  if(map.getZoom()<14){signMks.forEach(m=>{try{map.removeLayer(m);}catch{}});signMks=[];return;}
  try{
    const q=`[out:json][timeout:10];
(
  node["traffic_sign"](around:1000,${curLat},${curLng});
  node["traffic_sign:forward"](around:1000,${curLat},${curLng});
  way["maxspeed"](around:500,${curLat},${curLng});
  node["highway"="stop"](around:1000,${curLat},${curLng});
  node["highway"="give_way"](around:1000,${curLat},${curLng});
  node["highway"="crossing"](around:800,${curLat},${curLng});
);
out body 30;`;
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctrl.signal});
    if(!r.ok)return;
    const d=await r.json();
    signMks.forEach(m=>{try{map.removeLayer(m);}catch{}});signMks=[];
    (d.elements||[]).filter(e=>e.lat&&e.lon).forEach(e=>{
      const tags=e.tags||{};
      let html='',tip='';
      if(tags.highway==='stop'){
        html=`<div style="background:#ef4444;color:#fff;border:3px solid #fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.3)">DUR</div>`;
        tip='🛑 Dur işareti';
      } else if(tags.highway==='give_way'){
        html=`<div style="background:#f59e0b;color:#fff;border:3px solid #fff;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid #f59e0b;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))"></div>`;
        tip='⚠️ Öncelik ver';
      } else if(tags.highway==='crossing'){
        html=`<div style="background:#1d4ed8;color:#fff;border:2px solid #fff;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.3)">🚶</div>`;
        tip='🚶 Yaya geçidi';
      } else if(tags.maxspeed){
        const spd=parseInt(tags.maxspeed)||tags.maxspeed;
        html=`<div style="background:#fff;border:3px solid #ef4444;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#ef4444;box-shadow:0 2px 6px rgba(0,0,0,.3)">${spd}</div>`;
        tip=`🚗 Hız limiti: ${spd} km/s`;
      } else {
        const sign=tags.traffic_sign||tags['traffic_sign:forward']||'';
        if(!sign)return;
        html=`<div style="background:#fff;border:2px solid #1d4ed8;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;color:#1d4ed8;box-shadow:0 2px 6px rgba(0,0,0,.2)">🪧 ${sign.slice(0,8)}</div>`;
        tip=`🪧 Tabela: ${sign}`;
      }
      if(!html)return;
      const mk=L.marker([e.lat,e.lon],{icon:L.divIcon({html,iconSize:[34,34],iconAnchor:[17,17],className:''}) ,zIndexOffset:300}).addTo(map);
      mk.bindTooltip(tip,{direction:'top',opacity:.95});
      signMks.push(mk);
    });
  }catch{}
}
map.on('moveend',()=>{if(signsActive)fetchRoadSigns();});

// ── RADAR BOT GEÇECEĞİ ÖZELLIKLER ────────────────────────────
// 1. Rota üzerindeki tüm radarları önceden tara
async function scanRouteRadars(steps){
  if(!steps||!steps.length)return;
  const pts=steps.slice(0,20).map(s=>`(around:500,${s.lat},${s.lng})`).join('');
  if(!pts)return;
  try{
    const q=`[out:json][timeout:15];(node["highway"="speed_camera"]${pts};node["enforcement"="speed"]${pts};);out body;`;
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctrl.signal});
    if(!r.ok)return;
    const d=await r.json();
    (d.elements||[]).filter(e=>e.lat&&e.lon).forEach(e=>{
      const pt={id:'route_'+e.id,type:'fixed_radar',lat:e.lat,lng:e.lon,spd:parseInt(e.tags?.maxspeed||0)||0,name:'Rota Radarı'};
      if(!radarPts.find(x=>x.id===pt.id)){radarPts.push(pt);addRM(pt);}
    });
    if(d.elements?.length>0) speak(`Dikkat! Rotanızda ${d.elements.length} radar noktası var.`,false);
  }catch{}
}

// 2. Anlık radar uyarı panosu (en yakın 3)
function updateRadarPanel(){
  if(!curLat)return;
  const nearby=[...radarPts,...userReports]
    .map(r=>({...r,d:hav(curLat,curLng,r.lat,r.lng)}))
    .filter(r=>r.d<5000)
    .sort((a,b)=>a.d-b.d)
    .slice(0,3);
  let el=document.getElementById('radarPanel');
  if(!el){
    el=document.createElement('div');
    el.id='radarPanel';
    el.style.cssText='position:fixed;top:72px;left:12px;z-index:28;display:flex;flex-direction:column;gap:4px;pointer-events:none';
    document.body.appendChild(el);
  }
  if(!nearby.length){el.innerHTML='';return;}
  const RE2={fixed_radar:'📷',average_radar:'🎥',mobile_radar:'🚔',police:'👮',redlight_camera:'🚦',accident:'💥',traffic_jam:'🚗',hazard:'⚠️'};
  el.innerHTML=nearby.map(r=>`<div style="background:${RC[r.type]||'#f59e0b'};color:#fff;border-radius:10px;padding:5px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:.92"><span>${RE2[r.type]||'⚠️'}</span><span>${RL[r.type]||'Radar'}</span><span style="margin-left:auto;font-size:13px;font-weight:900">${fmtD(r.d)}</span></div>`).join('');
}
// Her GPS güncellemesinde radar panelini yenile
const _origOnPos=onPos;

// 3. POI ve tabela toggle butonları başlangıç bloğunda çağrılacak
function togglePOI(){

function toggleSigns(){

}
</script>

<script>
// ── SİMÜLASYON MODU ─────────────────────────────────────────
// Navigasyon sırasında araç rota üzerinde Google Maps gibi akar
let simActive=false,simIdx=0,simTimer=null;

function startSim(route){
  if(!route||!route.poly||route.poly.length<2)return;
  simActive=true;simIdx=0;
  clearInterval(simTimer);
  simTimer=setInterval(()=>{
    if(!simActive||!route.poly[simIdx])return;
    const pt=route.poly[simIdx];
    const nxt=route.poly[simIdx+1];
    // Heading hesapla
    if(nxt){
      const dLat=nxt.lat-pt.lat,dLng=nxt.lng-pt.lng;
      curHead=Math.atan2(dLng,dLat)*180/Math.PI;
      if(curHead<0)curHead+=360;
    }
    curLat=pt.lat;curLng=pt.lng;
    curSpd=40; // simülasyon hızı
    updMarker();
    if(navActive)navUpd();
    simIdx++;
    if(simIdx>=route.poly.length){clearInterval(simTimer);simActive=false;}
  },200); // 200ms'de bir nokta = akıcı hareket
}

function stopSim(){
  simActive=false;
  clearInterval(simTimer);simTimer=null;
  curSpd=0;
}

function toggleSim(){
  const btn=document.getElementById('btnSim');
  if(simActive){
    stopSim();
    btn.classList.remove('on');
    btn.querySelector('.ibl').textContent='Sim';
    speak('Simülasyon durduruldu.');
  } else {
    if(!routeData){speak('Önce bir rota oluşturun.');return;}
    btn.classList.add('on');
    btn.querySelector('.ibl').textContent='Durdur';
    followMode=true;
    startSim(routeData);
    speak('Simülasyon başladı.');
  }
}
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>RadarNav</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f2f7;--surface:#fff;--text:#1c1c1e;--sub:#8e8e93;
  --accent:#007aff;--danger:#ff3b30;--success:#34c759;--warn:#ff9500;
  --border:rgba(0,0,0,.1);--shadow:0 2px 20px rgba(0,0,0,.12);
  --nav:#007aff;--radius:16px;
}
body.dark{
  --bg:#000;--surface:#1c1c1e;--text:#fff;--sub:#636366;
  --border:rgba(255,255,255,.12);--shadow:0 2px 20px rgba(0,0,0,.5);
  --surface2:#2c2c2e;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;overflow:hidden;height:100dvh;width:100dvw;user-select:none}
#map{position:fixed;inset:0;z-index:0}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important}
/* GPS */
#overlay{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
/* Search — mini */
#searchBar{position:fixed;top:56px;left:12px;z-index:30;max-width:160px}
#sInput{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:13px;width:100px}
#sInput::placeholder{color:var(--sub)}
#sInput:focus{width:200px;transition:.3s}
#sInput::placeholder{color:var(--sub)}
#sDrop{background:var(--surface);border-radius:var(--radius);margin-top:6px;overflow:hidden;display:none;max-height:260px;overflow-y:auto;box-shadow:var(--shadow)}
.sItem{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--text);display:flex;align-items:center;gap:10px}
.sItem:hover{background:var(--bg)}
/* Nav bar — kompakt */
#navBar{position:fixed;top:0;left:0;right:0;z-index:30;display:none}
#navTop{display:flex;align-items:center;gap:8px;padding:56px 12px 10px;background:var(--nav)}
#navArrow{font-size:28px;min-width:36px;text-align:center}
#navDist{font-size:10px;font-weight:700;color:rgba(255,255,255,.75);margin-top:1px;text-align:center}
#navStep{flex:1;font-size:15px;font-weight:600;color:#fff;line-height:1.2}
#navSub{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
#navX{width:32px;height:32px;background:rgba(255,255,255,.2);border:none;border-radius:50%;cursor:pointer;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#nextHint{background:rgba(0,0,0,.25);padding:5px 12px 6px;font-size:11px;color:rgba(255,255,255,.6);display:none}
/* Speed */
#spd{position:fixed;left:16px;z-index:25;background:var(--surface);border-radius:14px;padding:8px 10px;min-width:70px;text-align:center;box-shadow:var(--shadow)}
#spdVal{font-size:32px;font-weight:800;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
#spdUnit{font-size:9px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
#spdGps{font-size:8px;color:var(--sub);margin-top:2px}
/* Radar banner */
#radarBanner{position:fixed;left:16px;right:72px;z-index:35;border-radius:var(--radius);padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.rbIcon{font-size:28px;flex-shrink:0}
.rbTitle{font-size:15px;font-weight:700;color:#fff}
.rbSub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.rbDist{margin-left:auto;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
/* Right panel — scroll */
#rp{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px);overflow-y:auto;overflow-x:visible;padding:4px}
#rp::-webkit-scrollbar{width:4px}
#rp::-webkit-scrollbar-track{background:transparent}
#rp::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.rb2{width:48px;height:48px;background:var(--surface);border:none;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);transition:.15s}
.rb2:hover,.rb2.on{background:rgba(0,122,255,.12);border:1.5px solid var(--accent)}
.rb2 .ico{font-size:19px}
.rb2 .lbl{font-size:7.5px;font-weight:700;color:var(--sub);letter-spacing:.2px}
/* Bottom */
#bot{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:0 10px 10px}
#botInner{display:flex;background:var(--surface);border-radius:20px;padding:6px 2px;box-shadow:var(--shadow)}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;cursor:pointer;color:var(--sub);font-size:9px;font-weight:600}
.bb .bi{font-size:21px}
.bb:hover{color:var(--accent)}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.mSheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:85dvh;overflow-y:auto;padding-bottom:30px}
.mHdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:1}
.mTitle{font-size:18px;font-weight:700}
.mX{width:32px;height:32px;background:var(--border);border:none;border-radius:50%;cursor:pointer;font-size:15px;color:var(--sub)}
/* Report */
#reportBox{position:fixed;right:68px;top:50%;transform:translateY(-50%);z-index:40;background:var(--surface);border-radius:var(--radius);padding:12px;display:none;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.rBtn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.rBtn:hover{background:rgba(0,122,255,.08)}
/* Alt rota */
#altBanner{position:fixed;bottom:90px;left:16px;right:72px;z-index:36;background:var(--surface);border-radius:var(--radius);padding:12px 16px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow)}
/* Settings rows */
.sRow{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.sLbl{font-size:15px;font-weight:500;color:var(--text)}
.sSub{font-size:12px;color:var(--sub);margin-top:1px}
.tgl{position:relative;width:44px;height:26px;cursor:pointer;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:#c7c7cc;border-radius:26px;transition:.25s}
.tsl:before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tgl input:checked+.tsl{background:var(--accent)}
.tgl input:checked+.tsl:before{transform:translateX(18px)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;font-weight:600;color:var(--sub)}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.secH{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--sub);padding:16px 18px 6px;text-transform:uppercase}
/* Fav/nearby items */
.li{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border)}
.liName{font-size:15px;font-weight:500;flex:1;color:var(--text)}
.liSub{font-size:12px;color:var(--sub);margin-top:1px}
.gbtn{padding:7px 16px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.dbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--danger);background:none;cursor:pointer;color:var(--danger);flex-shrink:0}
.catGrid{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.cat{width:calc(33.3%-6px);border-radius:12px;border:1.5px solid var(--border);background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text);text-align:center;min-width:0}
.cat:hover,.cat.sel{background:rgba(0,122,255,.08);border-color:var(--accent)}
.cat .ce{font-size:26px}
/* Animations */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pulse{animation:pulse .8s ease-in-out infinite}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.slideUp{animation:slideUp .2s ease}
/* Cursor — smooth dot */
.cursor-dot{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,122,255,.5)}
</style>
</head>
<body>

<!-- GPS Overlay -->
<div id="overlay">
  <div style="font-size:48px">🧭</div>
  <div style="font-size:20px;font-weight:700;color:var(--text)">RadarNav</div>
  <div style="font-size:14px;color:var(--sub)">Konum alınıyor...</div>
  <button id="skipBtn" onclick="hideOverlay()" style="margin-top:8px;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer">Devam Et</button>
</div>

<div id="map"></div>

<!-- Search — mini -->
<div id="searchBar" style="position:fixed;top:56px;left:12px;z-index:30;background:var(--surface);border-radius:20px;padding:0 10px;height:34px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);max-width:160px">
  <span style="font-size:12px;color:var(--sub)">🔍</span>
  <input id="sInput" placeholder="Ara" autocomplete="off" spellcheck="false" style="flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:13px;width:100px"/>
  <span id="sX" style="display:none;cursor:pointer;color:var(--sub);font-size:14px" onclick="clearSearch()">✕</span>
</div>
<div id="sDrop" style="position:fixed;top:98px;left:12px;right:12px;z-index:29;background:var(--surface);border-radius:12px;display:none;max-height:240px;overflow-y:auto;box-shadow:var(--shadow)"></div>

<!-- Nav Bar — kompakt -->
<div id="navBar">
  <div id="navTop">
    <div style="display:flex;flex-direction:column;align-items:center;min-width:36px">
      <div id="navArrow">⬆️</div>
      <div id="navDist">--</div>
    </div>
    <div style="flex:1;min-width:0">
      <div id="navStep">Hazırlanıyor...</div>
      <div id="navSub"></div>
    </div>
    <button id="navX" onclick="confirmStop()">✕</button>
  </div>
  <div id="nextHint"></div>
</div>

<!-- Speed -->
<div id="spd">
  <div id="spdVal">0</div>
  <div id="spdUnit">km/s</div>
  <div id="spdGps">GPS --</div>
</div>

<!-- Radar Banner -->
<div id="radarBanner">
  <div class="rbIcon" id="rbIcon">📷</div>
  <div style="flex:1;min-width:0">
    <div class="rbTitle" id="rbTitle">Radar</div>
    <div class="rbSub" id="rbSub"></div>
  </div>
  <div class="rbDist" id="rbDist">--</div>
</div>

<!-- Alt Rota Banner -->
<div id="altBanner">
  <span style="font-size:20px">🔀</span>
  <div style="flex:1">
    <div style="font-size:14px;font-weight:600;color:var(--text)" id="altInfo">Alternatif rota mevcut</div>
    <div style="font-size:12px;color:var(--sub)" id="altSub"></div>
  </div>
  <button class="gbtn" onclick="useAltRoute()">Kullan</button>
  <button onclick="closeAlt()" style="border:none;background:none;cursor:pointer;color:var(--sub);font-size:18px;padding:0 4px">✕</button>
</div>

<!-- Right Panel — kompakt -->
<div id="rp">
  <button class="rb2" onclick="goMe()" title="Konumum"><span class="ico">🎯</span><span class="lbl">Ben</span></button>
  <button class="rb2" id="btnFollow" onclick="toggleFollow()" title="Takip Modu"><span class="ico">🔒</span><span class="lbl">Takip</span></button>
  <button class="rb2" id="btnCam" onclick="camNext()" title="Kamera"><span class="ico">🚗</span><span class="lbl">Önden</span></button>
  <button class="rb2" id="btnLayer" onclick="layerNext()" title="Harita"><span class="ico">🗺️</span><span class="lbl">Harita</span></button>
  <button class="rb2 on" id="btnToll" onclick="toggleTolls()" title="Gişeler"><span class="ico">🛣️</span><span class="lbl">Gişe</span></button>
  <button class="rb2" id="btnVoice" onclick="voiceToggle()" title="Ses"><span class="ico">🔊</span><span class="lbl">Ses</span></button>
  <button class="rb2" onclick="toggleReport()" title="Bildir"><span class="ico">📢</span><span class="lbl">Bildir</span></button>
  <button class="rb2" onclick="openM('settModal')" title="Ayarlar"><span class="ico">⚙️</span><span class="lbl">Ayar</span></button>
</div>

<!-- Report Panel -->
<div id="reportBox">
  <button class="rBtn" onclick="rep('police')">👮 Polis</button>
  <button class="rBtn" onclick="rep('mobile_radar')">🚔 Seyyar</button>
  <button class="rBtn" onclick="rep('accident')">💥 Kaza</button>
  <button class="rBtn" onclick="rep('hazard')">⚠️ Tehlike</button>
  <button class="rBtn" onclick="rep('traffic_jam')">🚦 Trafik</button>
</div>

<!-- Bottom kaldırıldı — ev/araba/favori sağ panele taşındı -->

<!-- Sağ Panele eklendi: Ev, Araba, Favori, Yakın -->


<!-- Favoriler -->
<div class="modal" id="favModal"><div class="mSheet">
  <div class="mHdr"><span class="mTitle">⭐ Favoriler</span><button class="mX" onclick="closeM('favModal')">✕</button></div>
  <div onclick="addFav()" style="margin:12px 18px;padding:13px;border:1.5px dashed var(--accent);border-radius:12px;text-align:center;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px">＋ Mevcut Konumu Ekle</div>
  <div id="favList"></div>
</div></div>

<!-- Yakınımda -->
<div class="modal" id="nearModal"><div class="mSheet">
  <div class="mHdr"><span class="mTitle">📍 Yakınımda</span><button class="mX" onclick="closeM('nearModal')">✕</button></div>
  <div class="catGrid" id="catGrid"></div>
  <div id="nearRes"></div>
</div></div>

<!-- Ayarlar -->
<div class="modal" id="settModal"><div class="mSheet">
  <div class="mHdr"><span class="mTitle">⚙️ Ayarlar</span><button class="mX" onclick="closeM('settModal')">✕</button></div>
  <div id="settBody"></div>
</div></div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
// ════════════════════════════════════════════════
// AYARLAR
// ════════════════════════════════════════════════
const DEF = { layer:'osm', cam:'drive', unit:'kmh', voice:true, dark:false };
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('RNS')||'{}'));
const sv = v => localStorage.setItem('RNS', JSON.stringify(S=Object.assign(S,v)));
let homePos = JSON.parse(localStorage.getItem('RNhome')||'null');
let carPos  = JSON.parse(localStorage.getItem('RNcar')||'null');
let favs    = JSON.parse(localStorage.getItem('RNfavs')||'[]');
const saveFavs = () => localStorage.setItem('RNfavs', JSON.stringify(favs));

// ── Tema ──────────────────────────────────────────
if(S.dark) document.body.classList.add('dark');

// ════════════════════════════════════════════════
// HARİTA
// ════════════════════════════════════════════════
const TILES = {
  osm:       'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  light:     'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  dark:      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
};
const LKEYS = ['osm','light','dark','satellite'];
const LICO  = {osm:'🗺️',light:'☀️',dark:'🌑',satellite:'🛰️'};

const map = L.map('map', { zoomControl:false, attributionControl:false, tap:false });
let tileL = L.tileLayer(TILES[S.layer], { maxZoom:20 }).addTo(map);
map.setView([39.9, 32.8], 13);

// Sürüklemeyi algıla — takibi kes
map.on('dragstart', () => { follow = false; });

function layerNext() {
  const i = LKEYS.indexOf(S.layer);
  S.layer = LKEYS[(i+1) % LKEYS.length];
  sv({layer:S.layer});
  map.removeLayer(tileL);
  tileL = L.tileLayer(TILES[S.layer], { maxZoom:20 }).addTo(map);
  const btn = document.getElementById('btnLayer');
  btn.querySelector('.ico').textContent = LICO[S.layer];
  btn.querySelector('.lbl').textContent = S.layer==='osm'?'Harita':S.layer==='light'?'Açık':S.layer==='dark'?'Koyu':'Uydu';
  if(S.layer==='dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

// ════════════════════════════════════════════════
// GPS — Kalman + smooth interpolasyon
// ════════════════════════════════════════════════
let lat=null,lng=null,head=0,spd=0,acc=999;
let tLat=null,tLng=null; // hedef konum (interpolasyon için)
let follow=true, navActive=false;
let userMk=null;

// Kalman
const KF = { la:{x:0,p:1,R:4e-5}, ln:{x:0,p:1,R:4e-5} };
function klm(k,z,a) {
  const q = a>40?6e-5:a>15?2e-5:5e-6;
  k.p += q;
  const K = k.p/(k.p+k.R);
  k.x += K*(z-k.x);
  k.p *= (1-K);
  return k.x;
}

// GPS — hemen izin sor, timeout yok
function startGPS() {
  if (!navigator.geolocation) { hideOverlay(); return; }

  // Konum değişince
  navigator.geolocation.watchPosition(
    pos => {
      const a = Math.round(pos.coords.accuracy||99);
      const rla = pos.coords.latitude;
      const rln = pos.coords.longitude;
      // Kalman uygula
      if(lat===null){ KF.la.x=rla; KF.ln.x=rln; }
      tLat = klm(KF.la, rla, a);
      tLng = klm(KF.ln, rln, a);
      if(lat===null){ lat=tLat; lng=tLng; }
      // Heading — sadece hareket edince güncelle
      if(pos.coords.speed && pos.coords.speed > 0.5 && pos.coords.heading!==null)
        head = pos.coords.heading;
      acc = a;
      // Hız — gürültü filtrele (1.5 km/s altı = 0)
      const rawSpd = (pos.coords.speed||0) * 3.6;
      spd = rawSpd < 1.5 ? 0 : Math.round(rawSpd);
      hideOverlay();
      updSpd();
    },
    err => {
      console.warn('GPS:', err.message);
      // Hata olsa bile 3 sn sonra haritayı aç
      setTimeout(hideOverlay, 3000);
    },
    { enableHighAccuracy:true, maximumAge:1000, timeout:20000 }
  );

  // 5 saniyede GPS gelmezse yine de haritayı aç
  setTimeout(hideOverlay, 5000);
}

// Smooth interpolasyon — her 50ms bir adım
let iTimer = null;
function startInterp() {
  clearInterval(iTimer);
  iTimer = setInterval(() => {
    if (tLat===null) return;
    // Yumuşak geçiş (lerp)
    lat = lat + (tLat - lat) * 0.35;
    lng = lng + (tLng - lng) * 0.35;
    updMarker();
  }, 50);
}

function updMarker() {
  if (lat===null) return;
  const cur=CURSORS.find(c=>c.id===S.cursor)||CURSORS[0];
  if (!userMk) {
    if(cur.is3d){
      // 3D imleç — divIcon
      userMk = L.marker([lat,lng], {
        icon:L.divIcon({
          html:`<div style="font-size:28px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));transform:rotate(${head}deg)">${cur.icon}</div>`,
          iconSize:[28,28],iconAnchor:[14,14],className:''
        }),
        zIndexOffset:1000
      }).addTo(map);
    } else {
      // 2D dot
      userMk = L.circleMarker([lat,lng], {
        radius: S.cam==='drive'?11:9,
        color: '#fff',
        weight: 3,
        fillColor: cur.color,
        fillOpacity: 1
      }).addTo(map);
    }
  } else {
    userMk.setLatLng([lat,lng]);
    if(cur.is3d){
      userMk.setIcon(L.divIcon({
        html:`<div style="font-size:28px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));transform:rotate(${head}deg)">${cur.icon}</div>`,
        iconSize:[28,28],iconAnchor:[14,14],className:''
      }));
    }
  }
  if (follow) {
    const c = CAM[S.cam]||CAM.drive;
    map.panTo([lat+c.oY, lng+c.oX], { animate:true, duration:0.4, easeLinearity:0.5, noMoveStart:true });
  }
  if (navActive) navUpd();
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  ov.classList.add('hidden');
  setTimeout(() => ov.style.display='none', 500);
}

// ════════════════════════════════════════════════

<script>
// ════════════════════════════════════════════════
// TTS — tek kuyruk, tekrar yok, üst üste yok
// ════════════════════════════════════════════════
let _q=[], _playing=false, _lastTxt='', _lastAt=0, _voice=null, _aud=null;

function initVoice() {
  if (!window.speechSynthesis) return;
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  _voice = all.find(v=>/leyla/i.test(v.name))
    || all.find(v=>/emel/i.test(v.name))
    || all.find(v=>/seda/i.test(v.name))
    || all.find(v=>v.lang==='tr-TR')
    || all.find(v=>v.lang.startsWith('tr'));
}
if(window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = initVoice;
  initVoice();
  setTimeout(initVoice,600);
  setTimeout(initVoice,2000);
}

function say(txt, urgent) {
  if (!S.voice || !txt) return;
  const now = Date.now();
  // Aynı ses 4 saniye içinde tekrar söylenmesin
  if (txt===_lastTxt && now-_lastAt<4000) return;
  if (urgent) {
    // Acil → kuyruğu temizle, anında söyle
    _q = [];
    stopAudio();
    _playing = false;
  }
  // Kuyrukta varsa ekleme
  if (_q.includes(txt)) return;
  // Kuyruk max 3
  if (_q.length >= 3) _q.shift();
  _q.push(txt);
  nextSay();
}

function stopAudio() {
  if (_aud) { try{_aud.pause();} catch{} _aud=null; }
  try { speechSynthesis.cancel(); } catch{}
}

let _proc = false;
async function nextSay() {
  if (_proc || _playing || !_q.length) return;
  _proc = true;
  _playing = true;
  const txt = _q.shift();
  _lastTxt = txt;
  _lastAt = Date.now();
  try {
    // MP3 dene
    const key = audioKey(txt);
    if (key) {
      await playMP3(key, txt);
    } else {
      await playTTS(txt);
    }
  } catch(e) {
    console.warn('TTS err:', e);
  }
  _playing = false;
  _proc = false;
  if (_q.length) setTimeout(nextSay, 80);
}

function playMP3(key, fallback) {
  return new Promise(res => {
    const a = new Audio(`audio/${key}.mp3`);
    _aud = a;
    const done = () => { _aud=null; res(); };
    a.onended = done;
    a.onerror = () => { _aud=null; playTTS(fallback).then(res); };
    a.play().catch(() => { _aud=null; playTTS(fallback).then(res); });
    setTimeout(done, 9000); // max 9sn
  });
}

function playTTS(txt) {
  return new Promise(res => {
    if (!window.speechSynthesis) { res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang='tr-TR'; u.rate=1.02; u.pitch=1.04; u.volume=1;
    if (_voice) u.voice=_voice;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
    setTimeout(res, Math.min(txt.length*85+2000, 9000));
  });
}

<script>
// ════════════════════════════════════════════════
// YARDIMCI FONKSİYONLAR
// ════════════════════════════════════════════════
function hav(a,b,c,d) {
  const R=6371000, dr=(c-a)*Math.PI/180, dp=(d-b)*Math.PI/180;
  const x=Math.sin(dr/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dp/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmD(m) { return m>=1000?`${(m/1000).toFixed(1)} km`:`${Math.round(m)} m`; }
function fmT(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h?`${h}s ${m}dk`:`${m} dk`; }
function dLbl(m) {
  return m>=900?`${Math.round(m/100)*100} metre sonra`
       :m>=450?'500 metre sonra':m>=250?'300 metre sonra'
       :m>=150?'200 metre sonra':m>=80?'100 metre sonra'
       :m>=35?'50 metre sonra':'hemen şimdi';
}

// Hız göstergesi
function updSpd() {
  const v = S.unit==='mph' ? Math.round(spd*0.621) : spd;
  const el = document.getElementById('spdVal');
  el.textContent = v;
  el.style.color = spd>120?'var(--danger)':spd>80?'var(--warn)':'var(--text)';
  document.getElementById('spdUnit').textContent = S.unit==='mph'?'mph':'km/s';
  document.getElementById('spdGps').textContent = `GPS ${Math.min(acc,99)}m`;
  document.getElementById('spd').style.bottom = navActive?'110px':'88px';
}

// ═══════ ARAMA ═══════
let _st=null;
const sInp = document.getElementById('sInput');

sInp.addEventListener('input', () => {

async function doSearch(q) {
  try {

// ════════════════════════════════════════════════
// RADAR SİSTEMİ
// ════════════════════════════════════════════════
// NAVİGASYON — OSRM + akıcı adım + alternatif rota
// ════════════════════════════════════════════════
let route=null, routeL=null, routeO=null, destMk=null;
let stepIdx=0, warnedSteps={}, rerouteAt=0;
let altRoute=null, altL=null;

// Türkçe adım metni
const ORD=['','birinci','ikinci','üçüncü','dördüncü','beşinci','altıncı','yedinci','sekizinci'];
const MOD={left:'sola',right:'sağa','sharp left':'keskin sola','sharp right':'keskin sağa','slight left':'hafif sola','slight right':'hafif sağa',straight:'düz',uturn:'geri'};
function stepTxt(t,m,ex) {
  const m2=MOD[m]||'';
  switch(t) {
    case 'depart': return 'Yola çıkılıyor.';
    case 'arrive': return m==='left'?'Varış noktanız solunuzda.':m==='right'?'Varış noktanız sağınızda.':'Hedefe ulaştınız.';
    case 'turn': return m2?`${m2} dönün.`:'Dönün.';
    case 'continue':case 'new name': return m2&&m2!=='düz'?`${m2} devam edin.`:'Düz devam edin.';
    case 'roundabout':case 'rotary': { const e=ex||0; if(e>=1&&e<=8) return `Dönel kavşakta ${ORD[e]}. çıkıştan çıkın.`; return m2?`Dönel kavşaktan ${m2} çıkın.`:'Dönel kavşaktan çıkın.'; }
    case 'exit roundabout': return 'Kavşaktan çıkın.';
    case 'on ramp': return m==='left'?'Soldan rampaya girin.':'Sağdan rampaya girin.';
    case 'off ramp': return m==='left'?'Soldan rampadan çıkın.':'Sağdan rampadan çıkın.';
    case 'fork': return m==='left'?'Çatalda sola gidin.':'Çatalda sağa gidin.';
    case 'uturn': return 'Mümkün olan ilk yerde geri dönün.';
    default: return m2?`${m2} dönün.`:'Düz devam edin.';
  }
}
function stepArrow(t,m) {
  if(t==='arrive') return '📍';
  if(t==='depart') return '▶️';
  if(t==='roundabout'||t==='rotary') return '🔄';
  if(t==='uturn') return '↩️';
  if(m==='left'||m==='sharp left') return '⬅️';
  if(m==='right'||m==='sharp right') return '➡️';
  if(m==='slight left') return '↖️';
  if(m==='slight right') return '↗️';
  return '⬆️';
}

async function calcRoute(fla,fln,tla,tln,alts) {
  const url=`https://router.project-osrm.org/route/v1/driving/${fln},${fla};${tln},${tla}?steps=true&geometries=geojson&overview=full${alts?'&alternatives=true':''}`;
  const r = await fetch(url, {signal:AbortSignal.timeout(10000)});
  const d = await r.json();
  if(d.code!=='Ok'||!d.routes?.length) return null;
  const parse = rt => ({
    steps: rt.legs[0].steps.map(s=>({
      txt: stepTxt(s.maneuver?.type,s.maneuver?.modifier,s.maneuver?.exit),
      arrow: stepArrow(s.maneuver?.type,s.maneuver?.modifier),
      type: s.maneuver?.type||'',
      mod: s.maneuver?.modifier||'',
      exit: s.maneuver?.exit||0,
      dist: s.distance,
      lat: s.maneuver.location[1],
      lng: s.maneuver.location[0]
    })),
    poly: rt.geometry.coordinates.map(c=>({lat:c[1],lng:c[0]})),
    dist: rt.distance, dur: rt.duration
  });
  return { main: parse(d.routes[0]), alt: d.routes[1]?parse(d.routes[1]):null };
}

async function startNav(name, tla, tln) {
  if(lat===null){ sayKey('no_gps'); return; }
  clearRoute();
  navActive=true; stepIdx=0; warnedSteps={};
  follow=true;
  // UI
  document.getElementById('searchBar').style.display='none';
  document.getElementById('sDrop').style.display='none';
  document.getElementById('navBar').style.display='block';
  document.getElementById('navStep').textContent='Rota hesaplanıyor...';
  document.getElementById('navArrow').textContent='⏳';
  ['favModal','nearModal','settModal'].forEach(closeM);
  say('Rota hesaplanıyor.', false);

  try {
    const res = await calcRoute(lat,lng,tla,tln,true);
    if(!res){ sayKey('nav_no_route'); stopNav(); return; }
    route = res.main;
    drawRoute(route);
    // Alternatif rota varsa göster
    if(res.alt) showAltBanner(res.alt);
    sayKey('nav_ready');
    setTimeout(()=>say(`Toplam ${fmD(route.dist)}, yaklaşık ${fmT(route.dur)}.`), 1000);
    setTimeout(()=>{ if(route.steps[0]) say(route.steps[0].txt); }, 2200);
    navUpd();
  } catch(e) {
    console.error('Route err:', e);
    sayKey('nav_no_route');
    stopNav();
  }
}

function drawRoute(r) {
  clearRoute();
  const pts = r.poly.map(c=>[c.lat,c.lng]);
  routeO = L.polyline(pts,{color:'rgba(0,122,255,.2)',weight:12,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  routeL = L.polyline(pts,{color:'#007aff',weight:7,opacity:.95,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  destMk = L.marker([r.poly[r.poly.length-1].lat,r.poly[r.poly.length-1].lng],{
    icon:L.divIcon({html:'<div style="font-size:32px;margin-top:-32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">📍</div>',iconSize:[32,32],iconAnchor:[16,32],className:''})
  }).addTo(map);
  try{map.fitBounds(L.polyline(pts).getBounds(),{padding:[80,80],maxZoom:16,animate:true});}catch{}
}

function clearRoute() {
  if(routeO){map.removeLayer(routeO);routeO=null;}
  if(routeL){map.removeLayer(routeL);routeL=null;}
  if(destMk){map.removeLayer(destMk);destMk=null;}
  if(altL){map.removeLayer(altL);altL=null;}
}

function navUpd() {
  if(!route||lat===null) return;
  const steps = route.steps;
  if(stepIdx>=steps.length){stopNav();return;}
  const st = steps[stepIdx], last = steps[steps.length-1];
  const dN = hav(lat,lng,st.lat,st.lng);
  const dD = hav(lat,lng,last.lat,last.lng);

  // Adım tamamlandı mı
  if(dN<20 && stepIdx<steps.length-1){ stepIdx++; warnedSteps={}; return; }

  // UI güncelle
  document.getElementById('navArrow').textContent = st.arrow;
  document.getElementById('navDist').textContent = fmD(dN);
  document.getElementById('navStep').textContent = st.txt.charAt(0).toUpperCase()+st.txt.slice(1);
  const eta = Math.round(dD/Math.max(spd/3.6,5));
  const arr = new Date(Date.now()+eta*1000);
  document.getElementById('navSub').textContent = `${fmD(dD)} · ${fmT(eta)} · Varış: ${arr.getHours().toString().padStart(2,'0')}:${arr.getMinutes().toString().padStart(2,'0')}`;

  // Sonraki adımı göster
  const nxt = steps[stepIdx+1];
  const nh = document.getElementById('nextHint');
  if(nxt){ nh.textContent=`Sonra: ${nxt.arrow} ${nxt.txt}`; nh.style.display='block'; }
  else nh.style.display='none';

  // Hedefe varış
  if(dD<30){ sayKey('nav_arrived',true); stopNav(); return; }

  // Sesli eşikler
  for(const lvl of[1000,500,300,200,100,40]) {
    const k=`${stepIdx}_${lvl}`;
    if(dN<=lvl && !warnedSteps[k]) {
      warnedSteps[k]=true;
      navVoice(dN, st.txt, st.type, st.mod, st.exit);
      break;
    }
  }

  // Sapma tespiti — daha toleranslı
  const now=Date.now();
  if(dN>300 && now-rerouteAt>30000) { rerouteAt=now; doReroute(); }
}

async function doReroute() {
  document.getElementById('navArrow').textContent='🔄';
  say('Rotadan çıkıldı. Yeniden hesaplanıyor.', true);
  const last=route.steps[route.steps.length-1];
  try {
    const res=await calcRoute(lat,lng,last.lat,last.lng,false);
    if(res){route=res.main;clearRoute();drawRoute(route);stepIdx=0;warnedSteps={};}
  } catch{}
}

function stopNav() {

  document.getElementById('navBar').style.display='none';
  document.getElementById('searchBar').style.display='flex';
  document.getElementById('nextHint').style.display='none';
  updSpd();
}

function confirmStop() {
  if(confirm('Navigasyonu durdurmak istiyor musunuz?')){ sayKey('nav_stop'); stopNav(); }
}

// Sesli navigasyon — MP3 + TTS fallback
function navVoice(dist, txt, type, mod, ex) {
  if(type==='arrive'){ sayKey('nav_arrived'); return; }
  if(type==='depart'){ say('Yola çıkılıyor. İyi yolculuklar.'); return; }
  const dk = dist<=55?'50m':dist<=110?'100m':dist<=210?'200m':dist<=350?'300m':dist<=600?'500m':'1km';
  const isR=mod==='right'||mod==='sharp right'||mod==='slight right';
  const isL=mod==='left'||mod==='sharp left'||mod==='slight left';
  const isSR=mod==='slight right', isSL=mod==='slight left';
  const isShR=mod==='sharp right', isShL=mod==='sharp left';
  let pfx = isSR?'slight_right':isSL?'slight_left':isShR?'sharp_right':isShL?'sharp_left':isR?'turn_right':isL?'turn_left':'straight';
  if(type==='roundabout'||type==='rotary') { const k=`roundabout_${ex||'exit'}`; if(AMAP[k]){say(AMAP[k]);return;} }
  if(type==='uturn'){say(AMAP['uturn_now']);return;}
  if(type==='on ramp'){say(AMAP[mod==='left'?'ramp_left':'ramp_right']);return;}
  if(dist<35){const k=`${pfx}_now`;if(AMAP[k]){say(AMAP[k]);return;}}
  const k=`${pfx}_${dk}`;
  if(AMAP[k]){say(AMAP[k]);return;}
  // Fallback: en yakın key
  for(const d of['50m','100m','200m','300m','500m','1km']){const k2=`${pfx}_${d}`;if(AMAP[k2]){say(AMAP[k2]);return;}}
  // Son fallback: metin sentezi
  say(dist<35?txt:`${dLbl(dist)} ${txt}`);
}

// Alternatif rota
function showAltBanner(alt) {
  altRoute = alt;
  document.getElementById('altInfo').textContent='Alternatif rota bulundu';
  document.getElementById('altSub').textContent=`${fmD(alt.dist)} · ${fmT(alt.dur)}`;
  document.getElementById('altBanner').style.display='flex';
  sayKey('alt_route');
}
function useAltRoute() {
  if(!altRoute||lat===null) return;
  route=altRoute; altRoute=null;
  clearRoute(); drawRoute(route);
  stepIdx=0; warnedSteps={};
  closeAlt();
  say('Alternatif rotaya geçildi.');
}
function closeAlt(){document.getElementById('altBanner').style.display='none';}
</script>

<script>
// ════════════════════════════════════════════════
// RADAR SİSTEMİ
// ════════════════════════════════════════════════
const RE={fixed_radar:'📷',average_radar:'🎥',mobile_radar:'🚔',police:'👮',redlight_camera:'🚦',accident:'💥',traffic_jam:'🚗',hazard:'⚠️'};
const RC={fixed_radar:'#ff3b30',average_radar:'#ff453a',mobile_radar:'#ff9500',police:'#af52de',redlight_camera:'#ffcc00',accident:'#ff9500',traffic_jam:'#5e5ce6',hazard:'#ff9500'};
const RL={fixed_radar:'Sabit Hız Kamerası',average_radar:'Bölge Hız Radarı',mobile_radar:'Seyyar Radar',police:'Polis Kontrol Noktası',redlight_camera:'Kırmızı Işık Kamerası',accident:'Kaza',traffic_jam:'Trafik Sıkışıklığı',hazard:'Tehlikeli Nokta'};

// Türkiye & Almanya statik DB
const STATIC_R=[
  {id:'tr001',type:'fixed_radar',lat:41.0082,lng:28.9784,spd:50,name:'Sultanahmet'},
  {id:'tr002',type:'fixed_radar',lat:41.0609,lng:29.0046,spd:90,name:'TEM-E5'},
  {id:'tr003',type:'average_radar',lat:41.1042,lng:29.0219,spd:120,name:'FSM Köprüsü'},
  {id:'tr004',type:'fixed_radar',lat:40.9897,lng:28.8215,spd:90,name:'Havalimanı Yolu'},
  {id:'tr005',type:'average_radar',lat:41.0720,lng:29.1220,spd:90,name:'Bostancı Viyadük'},
  {id:'tr010',type:'fixed_radar',lat:39.9334,lng:32.8597,spd:50,name:'Ulus-Ankara'},
  {id:'tr011',type:'fixed_radar',lat:39.9512,lng:32.8622,spd:90,name:'Konya Yolu'},

let radarPts=[...STATIC_R], radarMks={}, warnedR={}, userReps=[];

function addRadar(r) {
  if(radarMks[r.id]) return;
  const c=RC[r.type]||'#ff9500', e=RE[r.type]||'⚠️';
  const spd=r.spd?`<div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:${c};color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px">${r.spd}</div>`:'';
  const icon=L.divIcon({
    html:`<div style="position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid ${c};border-radius:10px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.25)">${e}${spd}</div>`,
    iconSize:[36,44],iconAnchor:[18,22],className:''
  });
  const mk=L.marker([r.lat,r.lng],{icon,zIndexOffset:500}).addTo(map);
  mk.bindTooltip(`${RL[r.type]||'Radar'}${r.name?` · ${r.name}`:''}`+(r.spd?` (${r.spd} km/s)`:''),{direction:'top',opacity:.95});
  radarMks[r.id]=mk;
}

function initRadars(){radarPts.forEach(addRadar);}

async function fetchRadars() {
  if(lat===null) return;
  try {
    const q=`[out:json][timeout:15];(node["highway"="speed_camera"](around:5000,${lat},${lng});node["enforcement"="speed"](around:5000,${lat},${lng}););out body;`;
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),10000);
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctrl.signal});
    const d=await r.json();
    (d.elements||[]).filter(e=>e.lat&&e.lon).forEach(e=>{
      const pt={id:'osm_'+e.id,type:'fixed_radar',lat:e.lat,lng:e.lon,spd:parseInt(e.tags?.maxspeed||0)||0,name:e.tags?.name||null};
      if(!radarPts.find(x=>x.id===pt.id)){radarPts.push(pt);addRadar(pt);}
    });
  }catch{}
}

function checkRadars() {
  if(lat===null) return;
  let near=null,nearD=Infinity;
  [...radarPts,...userReps].forEach(r=>{
    const d=hav(lat,lng,r.lat,r.lng);
    // 300m geçince sıfırla
    if(d>350&&warnedR[r.id]?.has(250)){delete warnedR[r.id]; return;}
    if(d>5000){delete warnedR[r.id]; return;}
    if(d<=2000){
      if(!warnedR[r.id]) warnedR[r.id]=new Set();
      for(const lvl of[2000,1000,500,250]){
        if(d<=lvl&&!warnedR[r.id].has(lvl)){
          warnedR[r.id].add(lvl);
          const dk=d<=300?'250m':d<=600?'500m':'1km'; // kullan
          const kmap={fixed_radar:'radar_fixed',average_radar:'radar_fixed',mobile_radar:'radar_mobile',police:'radar_police',accident:'radar_accident',traffic_jam:'radar_traffic',hazard:'radar_accident',redlight_camera:'radar_fixed'};
          const k=kmap[r.type]||'radar_fixed';
          const txt=AMAP[k]||`Dikkat! ${dLbl(d)} ${RL[r.type]||'radar'}.`;
          say((r.spd?txt+` Hız limiti ${r.spd}.`:txt), true);
          break;
        }
      }
    }
    if(d<nearD){nearD=d;near=r;}
  });
  const b=document.getElementById('radarBanner');
  if(near&&nearD<=2000){
    b.style.display='flex'; b.style.background=RC[near.type]||'#ff9500';
    document.getElementById('rbIcon').textContent=RE[near.type]||'⚠️';
    document.getElementById('rbTitle').textContent=RL[near.type]||'Radar';
    document.getElementById('rbSub').textContent=near.name||(near.type==='police'?'Bildirilen kontrol noktası':'');
    document.getElementById('rbDist').textContent=fmD(nearD);
    nearD<250?b.classList.add('pulse'):b.classList.remove('pulse');
    b.style.bottom=(document.getElementById('bot').style.display==='none')?'16px':'98px';
  } else {
    b.style.display='none';b.classList.remove('pulse');
  }
}

function rep(type){
  if(!lat){sayKey('no_gps');return;}
  const pt={id:'u_'+Date.now(),type,lat,lng,spd:0,name:'Kullanıcı bildirimi'};
  userReps.push(pt); addRadar(pt);
  document.getElementById('reportBox').style.display='none';
  sayKey('report_saved');
}
</script>

function setCam(k){S.cam=k;sv({cam:k});const btn=document.getElementById('btnCam');btn.querySelector('.ico').textContent=CICO[k];btn.querySelector('.lbl').textContent=CAM[k].label;if(k!=='free'){follow=true;if(lat)map.setZoom(CAM[k].zoom,{animate:true});}renderSett();}
function setUnit(k){sv({unit:k});updSpd();renderSett();}
</script>

if(window.speechSynthesis){
  speechSynthesis.getVoices();
  setTimeout(initVoice,500);
  setTimeout(initVoice,2000);

setTimeout(()=>{if(lat!==null)fetchRadars();},5000);

// Radar ve gişe kontrolü (2 sn'de bir)
setInterval(()=>{
  if(lat===null) return;
  checkRadars();
  checkTolls();
}, 2000);

setInterval(()=>{
  if(!navActive||!route||lat===null) return;
  const last = route.steps[route.steps.length-1];
  const dD = hav(lat,lng,last.lat,last.lng);
  const eta = Math.round(dD/Math.max(spd/3.6,5));
  const arr = new Date(Date.now()+eta*1000);
  document.getElementById('navSub').textContent =
    `${fmD(dD)} · ${fmT(eta)} · Varış: ${arr.getHours().toString().padStart(2,'0')}:${arr.getMinutes().toString().padStart(2,'0')}`;
}, 15000);

map.on('click', e=>{
  if(navActive) return;
  if(document.getElementById('sInput')===document.activeElement) return;
